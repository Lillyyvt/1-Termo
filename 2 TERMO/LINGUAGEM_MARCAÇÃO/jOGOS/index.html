<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elefante Bailarina no Teatro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:linear-gradient(
        to bottom,
        #4a154b,
        #6a1b6d,
        #2b0a2d
    );
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
}

/* Cortina */
#game::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:120px;

    background:
    repeating-linear-gradient(
        90deg,
        #b3003c,
        #b3003c 40px,
        #d1004b 40px,
        #d1004b 80px
    );
}

/* Holofote */
#game::after{
    content:"";
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);

    width:700px;
    height:700px;

    background:
    radial-gradient(
        ellipse at center,
        rgba(255,255,180,.55),
        rgba(255,255,180,.15),
        transparent
    );

    pointer-events:none;
}

/* Palco */
#ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:140px;

    background:
    repeating-linear-gradient(
        90deg,
        #7b4a12,
        #7b4a12 30px,
        #91581b 30px,
        #91581b 60px
    );

    border-top:10px solid #c89b3c;
}

/* Pontuação */
#score{
    position:absolute;
    top:20px;
    left:20px;

    color:white;
    font-size:35px;
    font-weight:bold;

    text-shadow:2px 2px 5px black;
    z-index:100;
}

/* Elefante */
#player{
    position:absolute;

    width:130px;
    height:auto;

    left:120px;
    bottom:140px;

    z-index:10;

    object-fit:contain;

    filter:
    drop-shadow(0 0 10px white)
    drop-shadow(0 0 20px pink);
}

/* Obstáculos */
.obstacle{
    position:absolute;
    bottom:160px;
    font-size:55px;
    user-select:none;
}

/* Decorações */
.decor{
    position:absolute;
    font-size:55px;
}

/* Game Over */
#gameOver{
    display:none;

    position:absolute;
    inset:0;

    background:rgba(0,0,0,.8);

    z-index:999;

    color:white;

    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#gameOver h1{
    font-size:70px;
}

#gameOver p{
    font-size:35px;
    margin:20px;
}

#gameOver button{
    padding:15px 30px;
    border:none;
    border-radius:10px;

    background:#ff5fa2;
    color:white;

    font-size:22px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="game">

<div id="score">0</div>

<img
id="player"
src="ballet-removebg-preview.png"
alt="Elefante Bailarina">

<div class="decor" style="top:140px;left:60px;">✨</div>
<div class="decor" style="top:140px;right:60px;">🎭</div>
<div class="decor" style="top:240px;right:250px;">⭐</div>

<div id="ground"></div>

<div id="gameOver">
    <h1>🐘 GAME OVER</h1>
    <p>Pontos: <span id="finalScore">0</span></p>
    <button onclick="restartGame()">Jogar Novamente</button>
</div>

</div>

<script>

const player =
document.getElementById("player");

const scoreDisplay =
document.getElementById("score");

const fruits = [
"🍎",
"🍌",
"🍓",
"🍍",
"🍇",
"🍊",
"🥝"
];

let score = 0;
let gameOver = false;

let playerY = 140;
let jumpForce = 0;
let jumping = false;

let velocity = 8;

let obstacles = [];

/* Pulo */
function jump(){

    if(jumping || gameOver) return;

    jumping = true;
    jumpForce = 22;
}

document.addEventListener("keydown",(e)=>{

    if(
        e.code === "Space" ||
        e.code === "ArrowUp"
    ){
        jump();
    }
});

document.addEventListener(
"touchstart",
jump
);

/* Criar frutas */
function createObstacle(){

    if(gameOver) return;

    const obstacle =
    document.createElement("div");

    obstacle.className =
    "obstacle";

    obstacle.textContent =
    fruits[
        Math.floor(
        Math.random()*fruits.length
        )
    ];

    obstacle.x =
    window.innerWidth + 100;

    document
    .getElementById("game")
    .appendChild(obstacle);

    obstacles.push(obstacle);

    const next =
    Math.random()*1800 + 1200;

    setTimeout(
    createObstacle,
    next
    );
}

/* Atualizar pulo */
function updatePlayer(){

    if(jumping){

        playerY += jumpForce;

        jumpForce -= 1;

        if(playerY <= 140){

            playerY = 140;
            jumpForce = 0;
            jumping = false;
        }
    }

    player.style.bottom =
    playerY + "px";
}

/* Atualizar obstáculos */
function updateObstacles(){

    obstacles.forEach(
    (obstacle,index)=>{

        obstacle.x -= velocity;

        obstacle.style.left =
        obstacle.x + "px";

        const p =
        player.getBoundingClientRect();

        const o =
        obstacle.getBoundingClientRect();

        /* HITBOX MENOR */
        const elephant = {

            left:
            p.left + 35,

            right:
            p.right - 35,

            top:
            p.top + 20,

            bottom:
            p.bottom - 20
        };

        const collision =

            elephant.left < o.right &&
            elephant.right > o.left &&
            elephant.top < o.bottom &&
            elephant.bottom > o.top;

        if(collision){

            finishGame();
        }

        if(obstacle.x < -100){

            obstacle.remove();

            obstacles.splice(
            index,
            1
            );

            score += 10;

            scoreDisplay.textContent =
            score;
        }
    });
}

/* Fim de jogo */
function finishGame(){

    gameOver = true;

    document
    .getElementById(
    "finalScore"
    )
    .textContent = score;

    document
    .getElementById(
    "gameOver"
    )
    .style.display = "flex";
}

/* Reiniciar */
function restartGame(){

    obstacles.forEach(
    obstacle =>
    obstacle.remove()
    );

    obstacles = [];

    score = 0;

    velocity = 8;

    playerY = 140;

    jumpForce = 0;

    jumping = false;

    gameOver = false;

    scoreDisplay.textContent =
    "0";

    document
    .getElementById(
    "gameOver"
    )
    .style.display = "none";

    createObstacle();
}

/* Loop principal */
function gameLoop(){

    if(!gameOver){

        updatePlayer();

        updateObstacles();

        velocity += 0.0005;
    }

    requestAnimationFrame(
    gameLoop
    );
}

createObstacle();
gameLoop();

</script>

</body>
</html>
